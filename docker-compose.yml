x-service-defaults: &service-defaults
  init: true
  logging:
    driver: json-file
    options:
      max-size: "${DOCKER_LOG_MAX_SIZE:-25m}"
      max-file: "${DOCKER_LOG_MAX_FILE:-4}"

x-txt-db-guardrails: &txt-db-guardrails
  <<: *service-defaults
  mem_limit: "${TXT_DB_MEM_LIMIT:-3g}"
  memswap_limit: "${TXT_DB_MEMSWAP_LIMIT:-3g}"
  mem_reservation: "${TXT_DB_MEM_RESERVATION:-1g}"
  cpus: "${TXT_DB_CPUS:-2.5}"
  cpu_shares: ${TXT_DB_CPU_SHARES:-768}
  pids_limit: 512
  oom_score_adj: 300

x-txt-runtime-guardrails: &txt-runtime-guardrails
  <<: *service-defaults
  mem_limit: "${TXT_RUNTIME_MEM_LIMIT:-1g}"
  memswap_limit: "${TXT_RUNTIME_MEMSWAP_LIMIT:-1g}"
  mem_reservation: "${TXT_RUNTIME_MEM_RESERVATION:-256m}"
  cpus: "${TXT_RUNTIME_CPUS:-1.0}"
  cpu_shares: ${TXT_RUNTIME_CPU_SHARES:-512}
  pids_limit: 256
  oom_score_adj: 250

x-txt-market-guardrails: &txt-market-guardrails
  <<: *service-defaults
  mem_limit: "${TXT_MARKET_MEM_LIMIT:-2g}"
  memswap_limit: "${TXT_MARKET_MEMSWAP_LIMIT:-2g}"
  mem_reservation: "${TXT_MARKET_MEM_RESERVATION:-512m}"
  cpus: "${TXT_MARKET_CPUS:-2.0}"
  cpu_shares: ${TXT_MARKET_CPU_SHARES:-768}
  pids_limit: 384
  oom_score_adj: 250

x-txt-predictor-guardrails: &txt-predictor-guardrails
  <<: *service-defaults
  mem_limit: "${TXT_PREDICTOR_MEM_LIMIT:-3g}"
  memswap_limit: "${TXT_PREDICTOR_MEMSWAP_LIMIT:-3g}"
  mem_reservation: "${TXT_PREDICTOR_MEM_RESERVATION:-768m}"
  cpus: "${TXT_PREDICTOR_CPUS:-2.0}"
  cpu_shares: ${TXT_PREDICTOR_CPU_SHARES:-640}
  pids_limit: 384
  oom_score_adj: 300

x-txt-rust-guardrails: &txt-rust-guardrails
  <<: *service-defaults
  mem_limit: "${TXT_RUST_MEM_LIMIT:-2g}"
  memswap_limit: "${TXT_RUST_MEMSWAP_LIMIT:-2g}"
  mem_reservation: "${TXT_RUST_MEM_RESERVATION:-512m}"
  cpus: "${TXT_RUST_CPUS:-2.0}"
  cpu_shares: ${TXT_RUST_CPU_SHARES:-640}
  pids_limit: 512
  oom_score_adj: 250

x-txt-ui-guardrails: &txt-ui-guardrails
  <<: *service-defaults
  mem_limit: "${TXT_UI_MEM_LIMIT:-3g}"
  memswap_limit: "${TXT_UI_MEMSWAP_LIMIT:-3g}"
  mem_reservation: "${TXT_UI_MEM_RESERVATION:-768m}"
  cpus: "${TXT_UI_CPUS:-2.0}"
  cpu_shares: ${TXT_UI_CPU_SHARES:-512}
  pids_limit: 512
  oom_score_adj: 350

x-txt-ollama-guardrails: &txt-ollama-guardrails
  <<: *service-defaults
  mem_limit: "${TXT_OLLAMA_MEM_LIMIT:-6g}"
  memswap_limit: "${TXT_OLLAMA_MEMSWAP_LIMIT:-6g}"
  mem_reservation: "${TXT_OLLAMA_MEM_RESERVATION:-512m}"
  cpus: "${TXT_OLLAMA_CPUS:-2.0}"
  cpu_shares: ${TXT_OLLAMA_CPU_SHARES:-384}
  pids_limit: 512
  oom_score_adj: 350

x-txt-edge-guardrails: &txt-edge-guardrails
  <<: *service-defaults
  mem_limit: "${TXT_EDGE_MEM_LIMIT:-512m}"
  memswap_limit: "${TXT_EDGE_MEMSWAP_LIMIT:-512m}"
  mem_reservation: "${TXT_EDGE_MEM_RESERVATION:-128m}"
  cpus: "${TXT_EDGE_CPUS:-0.75}"
  cpu_shares: ${TXT_EDGE_CPU_SHARES:-768}
  pids_limit: 128
  oom_score_adj: -200

services:
  postgres:
    image: postgres:16-alpine
    container_name: txt-postgres
    restart: unless-stopped
    <<: *txt-db-guardrails
    environment:
      POSTGRES_DB: mission_control
      POSTGRES_USER: txt
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txt -d mission_control"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  runtime-redis:
    # Pinned to the 7.4-branch security patch (>= 7.4.9 fixes the 2026 Redis
    # RCE CVEs in client unblock / RESTORE / Lua). Stay on 7.4.x; do not jump
    # to 8.x just for features. Cache only (--save "" --appendonly no).
    image: redis:7.4.9-alpine
    container_name: runtime-redis
    restart: unless-stopped
    <<: *txt-runtime-guardrails
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  control-plane:
    image: txt-python:3.11
    build:
      context: .
      dockerfile: Dockerfile.txt-python
    container_name: control-plane
    restart: unless-stopped
    <<: *txt-runtime-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      SYSTEM_MODE: ${SYSTEM_MODE:-guarded_auto}
      RISK_GATEWAY_URL: http://risk-gateway:8001
      EXECUTION_ROUTER_URL: http://execution-router:8002
      MARKET_DATA_URL: http://market-data:8003
      BROKER_ADAPTER_URL: http://broker-adapter:8004
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:8005
      MT5_BRIDGE_URL: http://mt5-bridge:8006
      EMBEDDINGS_SERVICE_URL: http://embeddings-service:8007
      PREDICTOR_V8_URL: http://predictor-v8:8008
      RUST_EXECUTION_ENGINE_URL: http://rust-execution-engine:8011
      RUST_EXECUTION_ENGINE_ENABLED: "1"
      MARKET_RECORDER_URL: http://market-recorder:8009
      MARKET_RECORDER_EMIT_ENABLED: ${MARKET_RECORDER_EMIT_ENABLED:-0}
      RUNTIME_REDIS_URL: redis://runtime-redis:6379/0
      DATABASE_URL_FILE: /run/secrets/database_url
      APPROVAL_HMAC_SECRET_FILE: /run/secrets/approval_hmac_secret
    env_file:
      - ./.env
    command: >
      sh -c "uvicorn apps.control_plane.main:app --host 0.0.0.0 --port 8000 --ws websockets"
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    secrets:
      - database_url
      - approval_hmac_secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      runtime-redis:
        condition: service_healthy
      risk-gateway:
        condition: service_healthy
      execution-router:
        condition: service_healthy
      market-data:
        condition: service_healthy
      broker-adapter:
        condition: service_healthy
      ai-orchestrator:
        condition: service_healthy
      mt5-bridge:
        condition: service_healthy
      embeddings-service:
        condition: service_healthy
      predictor-v8:
        condition: service_healthy

  mt5-bridge:
    image: txt-python:3.11
    container_name: mt5-bridge
    restart: unless-stopped
    <<: *txt-runtime-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      MARKET_DATA_LIVENESS_PORT: 8010
      MT5_BRIDGE_MODE: live
    env_file:
      - ./.env
    command: >
      sh -c "uvicorn apps.mt5_bridge.main:app --host 0.0.0.0 --port 8006"
    expose:
      - "8006"
    secrets:
      - database_url
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  embeddings-service:
    image: txt-python:3.11
    container_name: embeddings-service
    restart: unless-stopped
    <<: *txt-runtime-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    env_file:
      - ./.env
    command: >
      sh -c "uvicorn apps.embeddings_service.main:app --host 0.0.0.0 --port 8007"
    expose:
      - "8007"
    secrets:
      - database_url
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  risk-gateway:
    image: txt-python:3.11
    container_name: risk-gateway
    restart: unless-stopped
    <<: *txt-runtime-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      RISK_POLICY_PATH: /workspace/config/risk_policy.json
      DATABASE_URL_FILE: /run/secrets/database_url
    command: >
      sh -c "uvicorn apps.risk_gateway.main:app --host 0.0.0.0 --port 8001"
    expose:
      - "8001"
    secrets:
      - database_url
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  execution-router:
    image: txt-python:3.11
    container_name: execution-router
    restart: unless-stopped
    <<: *txt-runtime-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      MARKET_DATA_URL: http://market-data:8003
      BROKER_ADAPTER_URL: http://broker-adapter:8004
      MARKET_RECORDER_URL: http://market-recorder:8009
      MARKET_RECORDER_EMIT_ENABLED: ${MARKET_RECORDER_EMIT_ENABLED:-0}
    command: >
      sh -c "uvicorn apps.execution_router.main:app --host 0.0.0.0 --port 8002"
    expose:
      - "8002"
    secrets:
      - database_url
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  market-data:
    image: txt-python:3.11
    container_name: market-data
    restart: unless-stopped
    <<: *txt-market-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      GOLDAPI_API_KEY_FILE: /workspace/secrets/goldapi_api_key
      TWELVEDATA_API_KEY_FILE: /workspace/secrets/twelvedata_api_key
      METALSAPI_API_KEY_FILE: /workspace/secrets/metalsapi_api_key
      MARKET_RECORDER_URL: http://market-recorder:8009
      MARKET_RECORDER_EMIT_ENABLED: ${MARKET_RECORDER_EMIT_ENABLED:-0}
    command: >
      sh -c "uvicorn apps.market_data_plane.main:app --host 0.0.0.0 --port 8003 --ws websockets"
    expose:
      - "8003"
    secrets:
      - database_url
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=5); sys.exit(0)"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  market-recorder:
    image: txt-python:3.11
    container_name: market-recorder
    restart: unless-stopped
    <<: *txt-market-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      MARKET_RECORDER_WRITER_ENABLED: ${MARKET_RECORDER_WRITER_ENABLED:-0}
      MARKET_RECORDER_STORAGE_ROOT: ${MARKET_RECORDER_STORAGE_ROOT:-/workspace/data/market-data}
      MARKET_RECORDER_BUNDLE_SIGNING_SECRET: ${MARKET_RECORDER_BUNDLE_SIGNING_SECRET:-txt-market-recorder-dev}
    command: >
      sh -c "uvicorn apps.market_recorder.main:app --host 0.0.0.0 --port 8009"
    expose:
      - "8009"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8009/health', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  broker-adapter:
    image: txt-python:3.11
    container_name: broker-adapter
    restart: unless-stopped
    <<: *txt-runtime-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      MARKET_DATA_URL: http://market-data:8003
    env_file:
      - ./.env
    command: >
      sh -c "uvicorn apps.broker_adapter.main:app --host 0.0.0.0 --port 8004"
    expose:
      - "8004"
    secrets:
      - database_url
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      market-data:
        condition: service_healthy

  ai-orchestrator:
    image: txt-python:3.11
    container_name: ai-orchestrator
    restart: unless-stopped
    <<: *txt-runtime-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    env_file:
      - ./.env
    command: >
      sh -c "uvicorn apps.ai_orchestrator.main:app --host 0.0.0.0 --port 8005"
    expose:
      - "8005"
    secrets:
      - database_url
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    <<: *txt-ollama-guardrails
    volumes:
      - ${OLLAMA_MODELS_DIR:-/root/.ollama}:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s

  predictor-v8:
    image: txt-python:3.11
    container_name: predictor-v8
    restart: unless-stopped
    <<: *txt-predictor-guardrails
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      PREDICTOR_V8_MODEL_PATH: /workspace/data/predictor_v8/model.json
      PREDICTOR_V8_SAMPLES_LOG_PATH: /workspace/data/predictor_v8/samples.jsonl
      PREDICTOR_V8_MAX_ALLOWED_LATENCY_MS: 300
      PREDICTOR_V8_MAX_ALLOWED_BACKLOG: 384
      PREDICTOR_V8_MIN_RENDERABLE_ROWS: 20
    command: >
      sh -c "uvicorn apps.predictor_v8.main:app --host 0.0.0.0 --port 8008"
    expose:
      - "8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  rust-execution-engine:
    image: rust:1.77-bookworm
    container_name: rust-execution-engine
    restart: unless-stopped
    <<: *txt-rust-guardrails
    working_dir: /workspace/rust-execution-engine
    volumes:
      - ./:/workspace
      - rust_execution_target:/workspace/rust-execution-engine/target
    environment:
      RUST_EXECUTION_ENGINE_PORT: 8011
      RUST_EXECUTION_ENGINE_NAME: rust-execution-engine
      RUST_LOG: info
      RUST_EXECUTION_ENGINE_HFT_ENABLED: ${RUST_EXECUTION_ENGINE_HFT_ENABLED:-0}
      RUST_EXECUTION_ENGINE_HFT_RING_CAPACITY: ${RUST_EXECUTION_ENGINE_HFT_RING_CAPACITY:-4096}
      RUST_EXECUTION_ENGINE_HFT_WORKER_CORE: ${RUST_EXECUTION_ENGINE_HFT_WORKER_CORE:-}
    command: >
      sh -c "cargo run --release"
    expose:
      - "8011"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8011 && printf \"GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  mission-control-ui-blue:
    image: node:20-alpine
    container_name: mission-control-ui-blue
    restart: unless-stopped
    <<: *txt-ui-guardrails
    working_dir: /workspace/ui/mission-control
    volumes:
      - ./:/workspace
    environment:
      PORT: 3001
      NODE_OPTIONS: --max-old-space-size=3072
      NEXT_DIST_DIR: .next-runtime-blue
      CONTROL_PLANE_URL: http://mission-control-gateway:3000/__mc_internal/control-plane
      CONTROL_PLANE_FALLBACK_URL: http://control-plane:8000
      PREDICTOR_V8_URL: http://predictor-v8:8008
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN}
      FORCE_UI_REBUILD_ON_BOOT: 0
      V2_RISK_JOURNAL_DIR: /workspace/logs
      ALLOCATION_DECISION_JOURNAL_DIR: /workspace/logs
      EXECUTION_FACT_JOURNAL_DIR: /workspace/logs
      OPPORTUNITY_COST_JOURNAL_DIR: /workspace/logs
      RUNTIME_DECISION_KPI_DIR: /workspace/logs
    env_file:
      - ./.env
    command: >
      sh /workspace/scripts/run_mission_control_ui.sh
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health/public"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      control-plane:
        condition: service_healthy

  mission-control-ui-green:
    image: node:20-alpine
    container_name: mission-control-ui-green
    restart: unless-stopped
    <<: *txt-ui-guardrails
    working_dir: /workspace/ui/mission-control
    volumes:
      - ./:/workspace
    environment:
      PORT: 3002
      NODE_OPTIONS: --max-old-space-size=3072
      NEXT_DIST_DIR: .next-runtime-green
      CONTROL_PLANE_URL: http://mission-control-gateway:3000/__mc_internal/control-plane
      CONTROL_PLANE_FALLBACK_URL: http://control-plane:8000
      PREDICTOR_V8_URL: http://predictor-v8:8008
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN}
      FORCE_UI_REBUILD_ON_BOOT: 0
      V2_RISK_JOURNAL_DIR: /workspace/logs
      ALLOCATION_DECISION_JOURNAL_DIR: /workspace/logs
      EXECUTION_FACT_JOURNAL_DIR: /workspace/logs
      OPPORTUNITY_COST_JOURNAL_DIR: /workspace/logs
      RUNTIME_DECISION_KPI_DIR: /workspace/logs
    env_file:
      - ./.env
    command: >
      sh /workspace/scripts/run_mission_control_ui.sh
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health/public"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      control-plane:
        condition: service_healthy

  mission-control-gateway:
    image: nginx:1.27-alpine
    container_name: mission-control-gateway
    restart: unless-stopped
    <<: *txt-edge-guardrails
    volumes:
      - ./docker/mission-control-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/mission-control:/runtime
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      mission-control-ui-blue:
        condition: service_healthy
      mission-control-ui-green:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      market-data:
        condition: service_healthy

  # Isolated, on-demand compactor (C1). Built from Dockerfile.compactor, which
  # adds pyarrow on top of txt-python:3.11 so Parquet cold archives work without
  # bloating the 10 trading services. The "tools" profile keeps it OUT of
  # `docker compose up`; it only runs via the systemd oneshot:
  #   docker compose run --rm --no-deps txt-jsonl-compactor
  txt-jsonl-compactor:
    image: txt-compactor:3.11
    build:
      context: .
      dockerfile: Dockerfile.compactor
    <<: *txt-runtime-guardrails
    # pyarrow (C1) materializes whole JSONL files into in-memory Arrow tables to
    # write Parquet, which spikes well past the file size. The market-data trade
    # files have grown to 65-90MB each, so the shared 1g runtime guardrail OOM-kills
    # the compactor (exit 137). Override mem for this batch-only container (it runs
    # via `docker compose run --rm`, not a persistent service) so Parquet succeeds.
    mem_limit: "${TXT_COMPACTOR_MEM_LIMIT:-3g}"
    memswap_limit: "${TXT_COMPACTOR_MEMSWAP_LIMIT:-3g}"
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >
      python scripts/jsonl_compactor.py --config config/jsonl_compactor.json

volumes:
  postgres_data:
  rust_execution_target:

secrets:
  approval_hmac_secret:
    file: ./secrets/approval_hmac_secret
  database_url:
    file: ./secrets/database_url
  postgres_password:
    file: ./secrets/postgres_password
